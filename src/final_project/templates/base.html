<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}My App{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand bg-body-tertiary mb-4">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">CS 188</a>
        <div class="navbar-nav">
          <a class="nav-link" href="{{ url_for('index') }}">Home</a>
        </div>
        {% if current_user %}
          <a class="nav-link" href="{{ url_for('account') }}">My account</a>
          <a class="nav-link" href="{{ url_for('nerd') }}">.      idiot</a>
        {% endif %}
        {% include "components/account_nav.html" %}
      </div>
    </nav>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    {% include "components/register_modal.html" %}
    {% include "components/login_modal.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
